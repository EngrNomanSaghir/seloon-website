<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ladyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3A1"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <radialGradient id="ladyCircleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241E15"/>
      <stop offset="85%" stop-color="#14110C"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </radialGradient>
  </defs>

  <!-- Background Medallion Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#ladyCircleBg)" stroke="url(#ladyGoldGrad)" stroke-width="2"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="url(#ladyGoldGrad)" stroke-width="0.75" stroke-opacity="0.5" stroke-dasharray="1.5,1.5"/>

  <!-- Elegant Lady Profile Sketch -->
  <!-- Forehead, Nose, Lips, Chin, Jawline, Neck -->
  <path d="M 44,25 
           C 47,28 48.5,33 48.5,38 
           C 48.5,41 49.2,43 51,45.5 
           L 54,49.5 
           C 51.5,50.5 49.5,51 49.5,52.5 
           C 49.5,53.5 51.5,54.5 53,55.5 
           C 50.5,56.5 48.5,57.5 49,59 
           C 49.5,61 52,62.5 52,64 
           C 52,66.5 46,70 41.5,72 
           C 40,73.5 43,82 45,86" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Closed Eye and Lash Line -->
  <path d="M 44.5,43.5 C 46,45 48,45.5 49.5,44.5" stroke="url(#ladyGoldGrad)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 47.5,45.5 L 49,47.5" stroke="url(#ladyGoldGrad)" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 45.8,45.2 L 46.5,47.2" stroke="url(#ladyGoldGrad)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Delicate Arched Eyebrow -->
  <path d="M 42.5,38 C 45,36.5 48,37 50,38.5" stroke="url(#ladyGoldGrad)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Subtle Lip Tint Accent -->
  <path d="M 50.8,54 C 52,54.2 53.2,54.8 53.6,55.2" stroke="url(#ladyGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Graceful Flowing Hair Waves (Sketch Lines) -->
  <!-- Top Crown Sweep -->
  <path d="M 33,28 C 39,20 49,20 56,23 C 65,27 68,34 68,43 C 68,54 62,60 66,71 C 69,78 67,83 63,86" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Inner Hair Swirl -->
  <path d="M 36,33 C 42,25 50,26 56,29 C 62,32 64,39 63,47 C 62,56 57,62 60,73 C 61,77 59,82 56,85" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Front Hair Fringe / Wave -->
  <path d="M 39,26 C 43,30 44,36 43,40 C 42,43 38,47 37,52 C 35.5,58 37,65 38.5,72 C 39.5,78 38,82 34,85" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Secondary Hair Tresses -->
  <path d="M 28,38 C 33,33 37,35 38,40 C 39,46 34,51 32,58 C 30,65 32,74 34,81" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Outer Hair Flourish / Cascade -->
  <path d="M 52,22 C 60,19 70,23 74,31 C 78,39 76,49 73,57 C 70,64 71,72 74,79 C 75,81 74,84 71,85" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Hair Ribbon / Shoulder Accent -->
  <path d="M 45,71 C 50,71 55,73 57,77 C 58.5,80 57,84 54,86" 
        stroke="url(#ladyGoldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Chic Earring Accent -->
  <circle cx="43.5" cy="56" r="1.3" fill="url(#ladyGoldGrad)"/>
  <path d="M 43.5,57.5 L 43.5,61.5" stroke="url(#ladyGoldGrad)" stroke-width="1" stroke-linecap="round"/>
  <circle cx="43.5" cy="62.5" r="1" fill="url(#ladyGoldGrad)"/>

  <!-- Starlet Sparkles -->
  <path d="M 72,21 L 73,23.5 L 75.5,24.5 L 73,25.5 L 72,28 L 71,25.5 L 68.5,24.5 L 71,23.5 Z" fill="url(#ladyGoldGrad)" opacity="0.9"/>
  <path d="M 27,26 L 27.8,28 L 30,28.8 L 27.8,29.6 L 27,31.5 L 26.2,29.6 L 24,28.8 L 26.2,28 Z" fill="url(#ladyGoldGrad)" opacity="0.75"/>
</svg>
